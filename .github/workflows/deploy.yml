name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to write Pages and mint the OIDC token deploy-pages uses.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't kill one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        # Pages serves this project from /gundalwada/, so every asset path
        # is prefixed at build time. Drop this env var when moving to a
        # custom domain served from the root.
        env:
          NEXT_PUBLIC_BASE_PATH: /gundalwada
        run: npm run build

      - name: Disable Jekyll
        # Without this, Pages' Jekyll pass silently drops the _next/ folder
        # and the site deploys with no CSS or JS at all.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
